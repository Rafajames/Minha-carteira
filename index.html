<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Minha Carteira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="icons/logo-light.png">
<link rel="icon" href="icons/logo-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/logo-light.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar + grid de cards; no celular, coluna única com barra inferior de 5 itens + "Mais" */
:root{
  --bg:#eef1f7;--card:#fff;--fg:#0f172a;--muted:#5f6878;--soft:#a3abb8;--line:#e8ebf1;--chip:#f3f5f9;
  --blue:#2563eb;--navy:#1e3a8a;--pink:#e11d48;--green:#15803d;--warn:#b45309;
  --tint-b:#2563eb14;--tint-p:#e11d4814;--tint-g:#15803d17;--tint-w:#b4530917;
  --cardA:#1c1d20;--cardB:#ea6a0a;--shadow:0 1px 2px #0f172a0a,0 6px 20px #0f172a08;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --p0:var(--blue);--p1:var(--pink);--p2:#0f766e;--p3:#7c3aed;--p4:#b45309;--p5:#0e7490;--logo:url(icons/logo-light.png);--v1:clamp(40px,5vw,56px);--v2:28px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f17;--card:#141a24;--fg:#e8ecf3;--muted:#a0a9b8;--soft:#5d6676;--line:#232c3a;--chip:#1b2230;--blue:#5b8cf8;--navy:#6d8fe0;--pink:#fb7185;--green:#4ade80;--warn:#fbbf24;--tint-b:#5b8cf81f;--tint-p:#fb71851f;--tint-g:#4ade801a;--tint-w:#fbbf241a;--shadow:none;--p2:#2dd4bf;--p3:#a78bfa;--p4:#fbbf24;--p5:#22d3ee;--logo:url(icons/logo-dark.png);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f17;--card:#141a24;--fg:#e8ecf3;--muted:#a0a9b8;--soft:#5d6676;--line:#232c3a;--chip:#1b2230;--blue:#5b8cf8;--navy:#6d8fe0;--pink:#fb7185;--green:#4ade80;--warn:#fbbf24;--tint-b:#5b8cf81f;--tint-p:#fb71851f;--tint-g:#4ade801a;--tint-w:#fbbf241a;--shadow:none;--p2:#2dd4bf;--p3:#a78bfa;--p4:#fbbf24;--p5:#22d3ee;--logo:url(icons/logo-dark.png);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
img{max-width:100%}[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.box{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;border:2px solid var(--card);flex:none}
.av{background:var(--pc,var(--blue))}.av.lg{width:34px;height:34px;font-size:13px}
.logo{width:38px;height:38px;flex:none;display:block;background:var(--logo) center/contain no-repeat}.logo.lg{width:88px;height:88px}
.duo{display:flex}.duo .av+.av{margin-left:-9px}
.nw{white-space:nowrap}

/* sidebar */
.side{padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px}
.brand b{display:block;font-size:14px}.brand small{color:var(--muted);font-size:11px}
.grp{color:var(--muted);font-size:11px;font-weight:500;padding:12px 10px 6px;letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;width:100%;text-align:left;color:var(--muted);font-weight:500}
.nav svg{width:16px;height:16px;stroke:currentColor;flex:none}
.nav:hover{background:var(--chip);color:var(--fg)}
.nav.on{background:var(--tint-b);color:var(--blue);font-weight:600}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.theme{display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:var(--muted)}
.seg2{display:flex;background:var(--chip);border-radius:20px;padding:3px}
.seg2 button{width:28px;height:24px;border-radius:14px;display:grid;place-items:center;color:var(--muted)}
.seg2 button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px #0002}
.me{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:12px 8px 0}
.me small{color:var(--muted);font-size:11px;display:flex;align-items:center;gap:4px}

/* topo */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px;position:relative}
.arrow{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:18px;flex:none}
.arrow:hover{background:var(--chip);color:var(--fg)}
.month{font-size:24px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;margin-left:6px}.month span{color:var(--soft);font-weight:500}
.tright{margin-left:auto;display:flex;gap:8px;align-items:center}
.bell{position:relative;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.bell:hover{background:var(--chip)}
.bell i{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;border:2px solid var(--card)}
.add{display:flex;background:var(--blue);color:#fff;border-radius:10px;font-weight:600;position:relative}
.add>button{color:#fff;padding:10px 14px;display:flex;gap:6px;align-items:center}
.add>button+button{border-left:1px solid #ffffff40;padding:10px}
.pop{position:absolute;top:calc(100% + 8px);right:0;z-index:20;min-width:260px;padding:8px;color:var(--fg);font-weight:400}
.pop h4{margin:6px 8px 8px;font-size:12px;color:var(--muted);font-weight:600}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 8px;border-radius:8px}
.opt:hover{background:var(--chip)}
.opt small{display:block;color:var(--muted);font-size:11px}
.empty{color:var(--muted);padding:10px 8px}

/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;grid-template-areas:"saldo saldo contas" "div cart mor" "saude saude obra"}
.grid.noobra{grid-template-areas:"saldo saldo contas" "div cart mor" "saude saude saude"}
.c{padding:20px;position:relative;min-width:0}
.h{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-right:70px}
.h small{color:var(--muted);font-weight:400;font-size:12px}
.lbl{color:var(--muted);font-size:12px;margin-top:14px}
.ill{position:absolute;right:16px;top:12px;width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 6px 8px #0f172a26);pointer-events:none}
.money{font-weight:800;letter-spacing:-.03em;font-size:var(--v2);margin-top:4px;white-space:nowrap;line-height:1.15}
.money .rs{color:var(--muted);font-weight:700;font-size:.8em}.money .ct{color:var(--muted);font-size:.5em;font-weight:500;letter-spacing:0}
.money.xl{font-size:var(--v1)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.btn{border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:600;font-size:12px;background:var(--card);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--chip)}
.btn.ok{color:var(--green);border-color:var(--green);background:var(--tint-g)}
.btnp{background:var(--blue);color:#fff;border-radius:9px;padding:10px 16px;font-weight:600}
.btnp:hover{filter:brightness(1.07)}
.link{color:var(--blue);font-weight:600;font-size:11.5px}
.chipw{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 10px 4px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chipw{background:color-mix(in srgb,var(--pc,var(--blue)) 13%,transparent);color:var(--pc,var(--blue))}
.chipw .dot{background:currentColor;width:6px;height:6px}
button.chipw:hover{filter:brightness(.95)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.nm{flex:1;min-width:0;font-weight:500}.nm small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:2px}
.val{font-weight:600;white-space:nowrap}

/* saldo */
#saldo{grid-area:saldo;display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px}
.tag{border-left:1px solid var(--line);padding-left:16px}
.tag b{color:var(--green);font-size:13px}.tag p{margin:3px 0 0;color:var(--muted);font-size:12px}
.stack{display:flex;gap:3px;height:10px;margin-top:auto;padding-top:28px;box-sizing:content-box}
.stack div{height:10px;border-radius:3px}
.stack div:first-child{border-radius:6px 3px 3px 6px}.stack div:last-child{border-radius:3px 6px 6px 3px}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.legend span{color:var(--muted);font-size:11.5px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.legend b{display:block;margin-top:6px;font-size:14px;white-space:nowrap}.legend em{color:var(--muted);font-style:normal;font-size:11px;font-weight:400}

/* contas */
#contas{grid-area:contas;display:flex;flex-direction:column}
.days{display:grid;gap:8px;margin:16px 0 4px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px 0 6px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.day:hover{background:var(--chip)}
.day i{display:flex;gap:2px;height:4px}.day i b{width:4px;height:4px;border-radius:50%;background:var(--soft)}
.day.late i b{background:var(--pink)}
.day.on{background:var(--blue);color:#fff;border-color:var(--blue)}.day.on i b{background:#fff}
.list{overflow:auto;max-height:236px;margin:0 -4px;padding:0 4px}
#contas .list{flex:1 1 0;min-height:96px;max-height:none}
@media (max-width:1180px){#contas .list{min-height:236px}}
.others{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;padding:14px 0 4px}
.bill{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.bill:last-child{border:0}
.ck{width:20px;height:20px;border:1.5px solid var(--soft);border-radius:50%;flex:none;display:grid;place-items:center}
.bill:hover .ck{border-color:var(--green)}
.bill.done .ck{background:var(--green);border-color:var(--green)}
.bill.done .ck::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.bill.done .nm{text-decoration:line-through;color:var(--muted)}
.late-t{color:var(--pink)!important;font-weight:600}

/* divisão */
#div{grid-area:div;display:flex;flex-direction:column;padding-bottom:0}
.who{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.who span{color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:5px}
.who b{display:block;font-size:15px;margin-top:3px}.who.two>div:last-child{text-align:right}
.who.two>div:last-child span{justify-content:flex-end}
.who{flex-wrap:wrap}
.split{position:relative;display:flex;height:26px;border-radius:8px;overflow:hidden;margin-top:10px;color:#fff;font-size:11px;font-weight:700;gap:2px}
.split div{display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden}
.split .sg{background:var(--pc,var(--blue))}.split .sg:last-of-type:not(:first-of-type){justify-content:flex-end}
.split .mid{position:absolute;top:0;bottom:0;width:2px;background:var(--card);padding:0}
.sub{font-weight:600;font-size:12px;margin:20px 0 4px}
.settle{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);margin:auto -20px 0;padding:14px 20px;font-size:12px;flex-wrap:wrap}
.settle .av{width:22px;height:22px;font-size:10px;border:0}
.settle p{margin:0;flex:1;min-width:150px;line-height:1.4}.settle small{color:var(--muted)}

/* cartões */
#cart{grid-area:cart}
.cbar{display:flex;align-items:center;gap:8px;margin-top:14px}
.cbar .sp{flex:1}
.circ{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.circ:hover{background:var(--chip);color:var(--fg)}
.viewport{overflow:hidden;margin-top:14px;border-radius:14px}
.track{display:flex;transition:transform .35s ease}
.cc{flex:0 0 100%;height:190px;border-radius:14px;padding:16px;color:#fff;display:flex;flex-direction:column;position:relative;background:linear-gradient(135deg,#3a3b40 0%,var(--cardA) 55%,#2a2a2e 100%)}
.cc.o{background:linear-gradient(135deg,#fb8a2e,var(--cardB))}
.cc .bk{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.pill{background:#ffffff2e;font-size:10px;font-weight:600;padding:3px 9px;border-radius:10px}
.chip{width:36px;height:26px;border-radius:5px;background:linear-gradient(135deg,#f1f2f4,#a6abb4);margin:auto 0}
.cname{position:absolute;left:68px;right:16px;top:46%;text-align:center;letter-spacing:.3em;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfoot{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.06em;opacity:.8}
.cfoot b{display:block;font-size:13px;letter-spacing:0;margin-top:3px}
.cfoot div:last-child{text-align:right}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots button{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .2s}
.dots button.on{width:18px;background:var(--blue)}
.nf{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;margin:20px 0 10px}
.inv{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.iv{background:var(--chip);border-radius:10px;height:150px;padding:12px 6px;text-align:center;position:relative;overflow:hidden;border:2px solid transparent}
.iv.on{border-color:var(--blue);background:var(--card)}
.iv b{font-size:12px;position:relative}
.iv .pill{background:var(--tint-b);color:var(--blue);display:inline-block;margin-top:4px;font-size:9px}
.iv .v{position:absolute;bottom:12px;left:0;right:0;font-size:12.5px;color:var(--muted)}
.iv.on .v{color:var(--blue);font-weight:700}
.iv.on .fill{position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(var(--tint-b),transparent)}
.inv svg{position:absolute;inset:0;width:100%;height:150px;pointer-events:none}

/* moradia */
#mor{grid-area:mor}
.ok2{font-weight:600;font-size:12px;margin-top:6px}.ok2 span{color:var(--muted);font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:10px;padding:3px;margin-top:18px}
.seg button{padding:8px;border-radius:8px;font-size:12px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px #0f172a14}
.meter{position:relative;margin-top:30px}
.mbar{height:16px;background:var(--chip);border-radius:6px;overflow:hidden}
.mbar div{height:100%;border-radius:6px;transition:width .4s}
.mk{position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;background:var(--fg)}
.mk span{position:absolute;top:-17px;left:-11px;font-size:10px;color:var(--muted);font-weight:600}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;margin-top:10px}
.inc{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:10px}
.it{display:flex;gap:10px;align-items:flex-start;min-width:0}
.ic{width:32px;height:32px;border-radius:9px;background:var(--tint-b);display:grid;place-items:center;flex:none}
.ic svg{width:15px;height:15px;stroke:var(--blue)}
.it small{color:var(--muted);font-size:11px;display:block;line-height:1.3}.it b{font-size:12.5px}

/* obra */
#obra{grid-area:obra}
.est{background:var(--tint-w);color:var(--warn);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:10px;vertical-align:middle;margin-left:8px;letter-spacing:0}
#obra p{color:var(--muted);font-size:12px;margin:6px 0 0}

/* páginas internas */
.view{display:flex;flex-direction:column;gap:16px}
.phead{display:flex;align-items:center;gap:14px;padding:2px 4px 0}
.phead img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 4px 6px #0f172a22)}
.phead h1{margin:0;font-size:22px;letter-spacing:-.02em;text-wrap:balance}.phead p{margin:3px 0 0;color:var(--muted)}
.pg{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.kpi .h{padding-right:0}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.leg2{display:flex;gap:14px;color:var(--muted);font-size:11.5px;margin-top:8px}.leg2 span{display:flex;gap:5px;align-items:center}
.txr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.txr:last-child{border:0}
.tic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:700}
.tic.in{background:var(--tint-g);color:var(--green)}.tic.out{background:var(--tint-b);color:var(--blue)}.tic.warn{background:var(--tint-w);color:var(--warn)}
.pos{color:var(--green)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0;font-weight:500}
.field input,.field select{font:inherit;font-size:13px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.form{display:grid;grid-template-columns:2fr 1fr 90px 1fr auto;gap:10px;align-items:end;margin-top:14px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;margin-top:14px}.form2 .full{grid-column:1/-1;justify-self:start}
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gcard{width:min(400px,100%);padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gcard img{width:72px;height:72px;filter:drop-shadow(0 6px 8px #0f172a26)}.gcard h1{margin:0;font-size:22px;letter-spacing:-.02em}.gcard p{margin:0;color:var(--muted);line-height:1.5}
.gbtn{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;padding:12px;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.gbtn.p{background:var(--blue);color:#fff;border-color:var(--blue)}.gbtn:hover{filter:brightness(.97)}
.gerr{color:var(--pink);font-size:12.5px;line-height:1.45}
.gform{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.gform .field input{padding:11px 12px}
.grow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gor{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;width:100%}.gor::before,.gor::after{content:"";flex:1;height:1px;background:var(--line)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.inv-link{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--chip);padding:10px;border-radius:8px;word-break:break-all;user-select:all;margin-top:10px}
.stackf{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.tw{overflow-x:auto;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;min-width:560px}

/* ===== dados ===== */

   {id:uid(),bk:"Santander",nm:"UNIQUE",venc:5,fecha:28,lim:39549.5,cls:"",lanc:[L("Celular",450,10,11),L("Supermercado",1250.4),L("Passagens aéreas",2400,6,2),L("Notebook",899.9,10,5),L("Restaurantes",640),L("Combustível",520),L("Assinaturas",189.4),L("Farmácia",310),L("Loja de roupas",1790,3,1)]},

  reserva:{meta:100000,saldo:42000,aportes:[3500,4000,4000,2500,4000,4000].map((v,i)=>({v,k:kOff(i-5)}))},
  acertos:[{k:kOff(-1),v:298.4,de:"e",para:"y"},{k:kOff(-2),v:120,de:"y",para:"e"},{k:kOff(-3),v:410.2,de:"e",para:"y"}],
  metas:{mercado:2000,lazer:600,transporte:3000,compras:2500},
  goals:[{id:uid(),n:"Viagem de férias",meta:6000,saldo:1500,prazo:kOff(8)}],
  bens:[{id:uid(),n:"Apartamento Vila Olímpia (na planta)",v:450000},{id:uid(),n:"Carro",v:68000}],
  dividas:[{id:uid(),n:"Financiamento Apartamento Vila Olímpia",saldo:310000,parcela:2332.54,rest:300}],
  vales:(()=>{const Y=HOJE.getFullYear(),M=HOJE.getMonth(),t1=new Date(Y,M,1,7).getTime(),VL=(n,v,d,b="y")=>({id:uid(),n,v,d,k:NOWK,by:b,at:Math.min(new Date(Y,M,d,12).getTime(),Date.now())});
   return [{id:uid(),emp:"Pluxee",tipo:"alim",dono:"y",dia:1,recarga:1200,base:1200,baseAt:t1,lanc:[VL("Supermercado",286.4,3),VL("Padaria",32,6),VL("Hortifruti",64.9,9)]},
    {id:uid(),emp:"VR",tipo:"ref",dono:"e",dia:5,recarga:880,base:40,baseAt:t1,lanc:[VL("Restaurante",45.9,6,"e"),VL("Almoço",38,7,"e"),VL("Lanchonete",22.5,10,"e")]}]})(),
  carro:{uber:2.4,lemb:[{id:uid(),n:"IPVA",data:`${HOJE.getFullYear()+1}-01-20`,km:0},{id:uid(),n:"Revisão",data:"",km:50000}]},
  lista:Object.fromEntries([["Café",0],["Leite",0],["Arroz",1]].map(([n,ok],i)=>[uid(),{n,ok,t:i+1}])),log:{},
  mes:{[kOff(-1)]:{paid:{...pa},settled:true},[kOff(-2)]:{paid:{...pa},settled:true}}};
}
const empty=()=>({v:3,regra:"50",people:[{id:"y",n:"Eu",sal:0,pess:0,dia:0,uid:null}],casa:[],bills:[],dia:[],extra:[],cards:[],reserva:{meta:10000,saldo:0,aportes:[]},acertos:[],metas:{},goals:[],bens:[],dividas:[],vales:[],lista:{},log:{},mes:{},learn:{},carro:{uber:2.4,lemb:[]},ess:{mercado:1,casa:1,carro:1,transporte:1,saude:1,educacao:1,familia:1},mesada:{},hol:{},bancos:[]});
function norm(d){
 d=d||{};
 if(!d.people){ // formato antigo → novo
  const u=d.uids||{};
  d.people=[{id:"y",n:d.n1||"Eu",sal:d.salario||0,pess:d.pessoais||0,dia:d.diaADia||0,uid:u.y||null},{id:"e",n:d.n2||"Esposa",sal:d.salEsposa||0,pess:d.pessoaisE||0,dia:d.diaE||0,uid:u.e||null}];
  d.mes=d.mes||{};const M=d.mes[NOWK]={paid:{},settled:!!d.settled};
  ["n1","n2","salario","salEsposa","pessoais","pessoaisE","diaADia","diaE","uids","settled"].forEach(k=>delete d[k]);
  (d.casa||[]).forEach(c=>{c.id=c.id||uid();if(c.n==="Apartamento Vila Olímpia"){c.obra=1;c.est=1}});
  (d.bills||[]).forEach(b=>{b.id=uid();b.rec=1;b.k=NOWK;if(b.done)M.paid[b.id]=1;delete b.done});
  ["dia","extra"].forEach(l=>(d[l]||[]).forEach(x=>{x.id=uid();x.k=NOWK}));
  (d.cards||[]).forEach(c=>{c.id=uid();c.lanc=(c.lanc||[]).map(l=>({id:uid(),n:l.n,v:l.v,p:l.p?l.p[1]:1,k:kOff(l.p?-(l.p[0]-1):0)}));c.lim=Math.round(((c.livre||0)+c.lanc.reduce((t,l)=>{const i=mIdx(NOWK)-mIdx(l.k);return t+(i<l.p?l.v*(l.p-i):0)},0))*100)/100;delete c.fat;delete c.livre;delete c.prox;delete c.st});
  if(d.reserva&&d.reserva.aportes)d.reserva.aportes=d.reserva.aportes.map((v,i,a)=>typeof v==="number"?{v,k:kOff(i-a.length+1)}:v);
  d.acertos=(d.acertos||[]).map((a,i)=>a.k?a:{k:kOff(-(i+1)),v:a.v,de:a.de,para:a.de==="y"?"e":"y"});
  d.v=3;
 }
 const E=empty();for(const k in E)if(d[k]==null)d[k]=E[k];
 if(!d.people.length)d.people=E.people;
 d.casa.forEach(c=>{if(!c.id)c.id=uid()});
 if(!d.carro.lemb)d.carro.lemb=[];if(Array.isArray(d.lista))d.lista={};if(Array.isArray(d.log))d.log={};
 d.cards.forEach(c=>{if(c.fecha==null)c.fecha=c.venc>7?c.venc-7:c.venc+21});d.people.forEach(p=>{if(!p.pay)p.pay=1});(d.vales||[]).forEach(v=>{if(!v.lanc)v.lanc=[];if(!v.id)v.id=uid()});
 return d;
}
const normP=p=>Object.assign({bills:[],dia:[],extra:[],mes:{},ext:{},ini:{}},p||{});
const KEY="minha-carteira-v3",OLDKEY="minha-carteira-v2";
let D=null,P=normP();
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function loadLocal(){
 let d=null,p=null;try{d=JSON.parse(lsGet(KEY)||lsGet(OLDKEY));p=JSON.parse(lsGet(KEY+"-p"))}catch(e){}
 D=norm(d&&d.casa?d:seed());P=normP(p);
}

/* ===== salvar ===== */
let MODE=null,me="y",baseD=null,baseP="",tD=null,tP=null,dirty=false,skipped=null;
function diff(a,b,path,out){
 const ks=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
 for(const k of ks){const x=a?a[k]:undefined,y=b?b[k]:undefined,p=path+"."+k;
  if(isObj(x)&&isObj(y))diff(x,y,p,out);
  else if(JSON.stringify(x)!==JSON.stringify(y))out[p]=y===undefined?firebase.firestore.FieldValue.delete():y;}
 return out;
}
function save(){
 if(MODE!=="cloud"){lsSet(KEY,JSON.stringify(D));lsSet(KEY+"-p",JSON.stringify(P));return}
 if(!famId||!db||!baseD)return;
 if(Object.keys(diff(baseD,clone(D),"data",{})).length){dirty=true;clearTimeout(tD);tD=setTimeout(flushD,400)}
 if(JSON.stringify(P)!==baseP){clearTimeout(tP);tP=setTimeout(flushP,400)}
}
function flushD(){
 const now=clone(D),up=diff(baseD,now,"data",{});
 if(!Object.keys(up).length){dirty=false;return}
 up.updatedAt=firebase.firestore.FieldValue.serverTimestamp();up.updatedBy=fbUser.uid;baseD=now;
 db.doc("families/"+famId).update(up).then(()=>{dirty=false;if(skipped){const f=skipped;skipped=null;applySnap(f)}})
  .catch(e=>{dirty=false;toast("Não foi possível salvar: "+errMsg(e))});
}
function flushP(){const p=clone(P);baseP=JSON.stringify(P);db.doc("users/"+fbUser.uid).update({priv:p}).catch(e=>toast("Não foi possível salvar: "+errMsg(e)))}

/* ===== utilidades ===== */
let mes=HOJE.getMonth(),ano=HOJE.getFullYear(),selDay=null,cardI=0,morMode=1,cur="visao",fF="todas",fB="",cSel=0;
const $=id=>document.getElementById(id);
const brl=v=>(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const money=v=>{const [i,c]=brl(Math.abs(v)).split(",");return `<span class="rs">${v<0?"− ":""}R$</span> ${i}<span class="ct">,${c}</span>`};
const sum=a=>a.reduce((s,x)=>s+(+x.v||0),0);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const num=s=>{let t=String(s==null?"":s).replace(/[^\d,.-]/g,"");if(/mil\b/i.test(String(s))&&!/[,.]\d{1,2}$/.test(t))return (parseFloat(t.replace(",","."))||0)*1000;if(!t.includes(",")&&/^-?\d+\.\d{1,2}$/.test(t))return parseFloat(t)||0;return parseFloat(t.replace(/\./g,"").replace(",","."))||0};
const day=s=>Math.min(Math.max(+s||1,1),31);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON=n=>`icons/${n}.png`;

const K=()=>mk(ano,mes),kPlus=n=>{const [a,m]=mAdd(ano,mes,n);return mk(a,m)};

function toast(msg,undo){const t=$("toast");t.innerHTML=`<span>${esc(msg)}</span>${undo?`<button class="tundo" id="tUndo">Desfazer</button>`:""}`;t.hidden=false;if(undo)$("tUndo").onclick=()=>{t.hidden=true;undo()};clearTimeout(toast.k);toast.k=setTimeout(()=>t.hidden=true,undo?6000:2600)}

/* pessoas */
const person=id=>D.people.find(p=>p.id===id)||D.people[0];

function casaCalc(){
 const total=sum(D.casa),ps=D.people.map(p=>{const paid=sum(D.casa.filter(c=>qid(c)===p.id)),fair=D.casa.reduce((s,c)=>s+c.v*fairOf(c,p.id),0);return {id:p.id,paid,fair,bal:paid-fair}}).filter(p=>!person(p.id).dep||p.paid>0);
 const deb=ps.filter(p=>p.bal<-.005).map(p=>({id:p.id,v:-p.bal})),cre=ps.filter(p=>p.bal>.005).map(p=>({id:p.id,v:p.bal})),tr=[];
 let i=0,j=0;while(i<deb.length&&j<cre.length){const v=Math.min(deb[i].v,cre[j].v);if(v>.005)tr.push({de:deb[i].id,para:cre[j].id,v});deb[i].v-=v;cre[j].v-=v;if(deb[i].v<.005)i++;if(cre[j].v<.005)j++}
 return {total,ps,tr};
}

/* meses, contas e cartões */
const mref=(S,k)=>{if(!S.mes[k])S.mes[k]={paid:{}};if(!S.mes[k].paid)S.mes[k].paid={};return S.mes[k]};

 }

let hojeOff=0;
function diaItens(dt){
 const k=mk(dt.getFullYear(),dt.getMonth()),d=dt.getDate(),same=t=>{if(!t)return false;const x=new Date(t);return x.getFullYear()===dt.getFullYear()&&x.getMonth()===dt.getMonth()&&x.getDate()===d},o=[];
 const push=(x,v,src,id,t)=>o.push({n:x.n||"?",v,src:src+(x.bco?" · "+x.bco:""),id,t:t||x.at||0,by:x.by,priv:x.priv});
 [[D,0],[P,1]].forEach(([S,pv])=>{
  S.dia.filter(x=>x.k===k&&x.d===d).forEach(x=>push(Object.assign({priv:pv},x),-x.v,x.cid?`débito ${(D.cards.find(c=>c.id===x.cid)||{bk:""}).bk}`:"gasto do dia",x.id));
  S.extra.filter(x=>vis(x,k)&&x.d===d).forEach(x=>push(Object.assign({priv:pv},x),+x.v,x.rec?"entrada fixa":"entrada",x.id));
  Object.entries(S.mes||{}).forEach(([mk_,m])=>Object.entries((m&&m.paid)||{}).forEach(([id,r])=>{if(!r||typeof r!=="object"||!same(r.t))return;const b=S.bills.find(x=>x.id===id);if(b)push({n:b.n,by:r.b,priv:pv,bco:r.bco},-b.v,`conta paga${mk_!==k?` (${AB[+mk_.slice(6)-1].toLowerCase()})`:""}`,b.id,r.t)}))});
 (D.vales||[]).forEach(v=>v.lanc.filter(x=>x.k===k&&x.d===d).forEach(x=>push(x,-x.v,"vale "+v.emp,x.id)));
 salTx(ME(),k).filter(s=>s.d===d).forEach(s=>o.push({n:s.n+(s.prev?" (previsto)":""),v:s.v,src:"salário"+(ME().bco?" · "+ME().bco:""),id:"",t:0}));
 return o.sort((a,b)=>(b.t||0)-(a.t||0));
}
function renderHoje(){
 const t=new Date(),dt=new Date(t.getFullYear(),t.getMonth(),t.getDate()+hojeOff),L=diaItens(dt),E=sum(L.filter(x=>x.v>0)),S=-sum(L.filter(x=>x.v<0)),B=E-S;
 const nm=hojeOff===0?"Hoje":hojeOff===-1?"Ontem":DIAS[dt.getDay()][0].toUpperCase()+DIAS[dt.getDay()].slice(1),hh=x=>{const d=new Date(x);return `${two(d.getHours())}h${two(d.getMinutes())}`};
 $("hoje").innerHTML=`<div class="hhead"><div class="h">${nm} <small>· ${hojeOff>-2?DIAS[dt.getDay()]+", ":""}${two(dt.getDate())}/${two(dt.getMonth()+1)}</small></div><span class="sp"></span>${hojeOff?`<button class="link" id="hjN0">voltar para hoje</button>`:""}<button class="circ" id="hjP" aria-label="Dia anterior">‹</button><button class="circ" id="hjN" aria-label="Próximo dia"${hojeOff>=0?" disabled":""}>›</button></div>
 <div class="hsum"><div><span class="lbl">Saiu</span><b>R$ ${brl(S)}</b></div><div><span class="lbl">Entrou</span><b class="pos">R$ ${brl(E)}</b></div><div><span class="lbl">Balanço do dia</span><b style="color:${B>=0?"var(--green)":"var(--pink)"}">${B<0?"− ":B>0?"+ ":""}R$ ${brl(Math.abs(B))}</b></div></div>
 ${L.length?`<div class="list hlist2">${L.map(x=>`<div class="txr${x.t&&now()-x.t<5000?" flash":""}"><span class="tic ${x.v>0?"in":"out"}">${x.v>0?"+":"−"}</span><div class="nm"><b>${esc(x.n)}${x.priv?` <span class="tagp">só você</span>`:""}</b><small>${[x.src,x.t?hh(x.t):"",x.by&&D.people.some(p=>p.id===x.by)?person(x.by).n:""].filter(Boolean).join(" · ")}</small></div><span class="val ${x.v>0?"pos":""}">${x.v>0?"+":"−"} R$ ${brl(Math.abs(x.v))}</span>${x.id&&find(x.id)?edb(x.id,x.n):""}</div>`).join("")}</div>`:`<div class="note">${hojeOff?"Nada lançado neste dia.":"Nada lançado hoje ainda. Use o campo acima, por exemplo: mercado 85,90."}</div>`}`;

/* ===== rotas e render ===== */
const V={visao:null,fluxo:pFluxo,cartoes:pCartoes,casa:pCasa,reserva:pReserva,renda:pRenda,contas:pContas,plano:pPlano,patrimonio:pPatr,lista:pLista,ajuda:pAjuda,cat:pCat,extratos:pExt};
function route(){
 cur=(location.hash||"#visao").slice(1);if(!(cur in V))cur="visao";
 document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+cur);
 document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===cur));
 $("maisBtn").classList.toggle("on",MAIS.some(m=>m[0]===cur));
 if(D&&V[cur])V[cur]();scrollTo(0,0);
}
addEventListener("hashchange",route);
function renderMonth(){$("month").innerHTML=`${MESES[mes]} <span>${ano}</span>`}
function renderAll(){if(!D)return;save();renderSide();renderMonth();renderHello();renderHoje();renderBancos();renderResumo();renderKpis();renderAviso();renderSemana();renderOnde();renderGastar();renderConq();renderSaldo();renderContas();renderDiv();renderCart();renderVline();renderMor();renderObra();renderSaude();renderBell();if(V[cur])V[cur]()}
const goM=n=>{[ano,mes]=mAdd(ano,mes,n);selDay=null;renderAll()};
$("prev").onclick=()=>goM(-1);$("next").onclick=()=>goM(1);

/* ===== tema ===== */
function syncTheme(){const t=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.querySelectorAll(".tl").forEach(b=>b.classList.toggle("on",t==="light"));document.querySelectorAll(".td").forEach(b=>b.classList.toggle("on",t==="dark"))}
function setTheme(t){document.documentElement.dataset.theme=t;lsSet("mc-theme",t);syncTheme()}
function bindTheme(){document.querySelectorAll(".tl").forEach(b=>b.onclick=()=>setTheme("light"));document.querySelectorAll(".td").forEach(b=>b.onclick=()=>setTheme("dark"))}
{const t=lsGet("mc-theme");if(t)document.documentElement.dataset.theme=t}
bindTheme();syncTheme();

try{boot()}catch(e){gate("error","Erro ao iniciar: "+(e&&e.message||e))}
